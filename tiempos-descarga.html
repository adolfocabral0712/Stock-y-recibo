<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Tiempos Descarga Planta FAS</title>

  <!-- Gráficos. Requiere conexión a Internet para cargar Chart.js. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: #0b1220;
      --panel: #121c2f;
      --panel-2: #17243b;
      --line: #2a3b57;
      --text: #e8eef8;
      --muted: #9aacc6;
      --accent: #39d0ba;
      --accent-2: #6ca8ff;
      --warning: #ffbd59;
      --danger: #ff7373;
      --shadow: 0 14px 36px rgba(0,0,0,.22);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background:
        radial-gradient(circle at 0 0, rgba(57,208,186,.08), transparent 32%),
        radial-gradient(circle at 100% 0, rgba(108,168,255,.10), transparent 34%),
        var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap { max-width: 1700px; margin: 0 auto; padding: 24px; }
    .topbar {
      display: flex; gap: 20px; align-items: flex-start; justify-content: space-between;
      padding: 6px 0 22px;
    }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 34px); letter-spacing: -.6px; }
    .subtitle { margin-top: 8px; color: var(--muted); font-size: 14px; }
    .status {
      display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
      padding: 10px 13px; border: 1px solid var(--line); border-radius: 999px;
      color: var(--muted); background: rgba(18,28,47,.72); font-size: 13px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warning); box-shadow: 0 0 12px currentColor; }

    .notice {
      border: 1px solid rgba(255,189,89,.45); background: rgba(255,189,89,.10);
      border-radius: 12px; padding: 13px 15px; color: #ffe0a6; margin-bottom: 18px;
      display: none; font-size: 14px;
    }
    .notice.error { border-color: rgba(255,115,115,.50); background: rgba(255,115,115,.11); color: #ffd0d0; }

    .filters {
      display: grid; grid-template-columns: repeat(4, minmax(155px, 1fr)) auto;
      gap: 12px; padding: 16px; background: rgba(18,28,47,.92);
      border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    label { display: block; color: var(--muted); font-size: 12px; margin: 0 0 6px; }
    select, input, button {
      width: 100%; min-height: 39px; border-radius: 9px; font: inherit;
    }
    select, input {
      color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
      padding: 8px 10px; outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(57,208,186,.12); }
    button {
      align-self: end; color: #06221f; background: var(--accent); border: 0;
      padding: 8px 14px; cursor: pointer; font-weight: 700;
    }
    button:hover { filter: brightness(1.07); }

    .kpis {
      display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 14px;
      margin-bottom: 18px;
    }
    .kpi, .card {
      background: rgba(18,28,47,.92); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .kpi {
      padding: 17px;
      min-height: 118px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .kpi-title { color: var(--muted); font-size: 13px; }
    .kpi-value {
      margin-top: 9px;
      font-weight: 750;
      font-size: clamp(27px, 3vw, 38px);
      line-height: 1;
      text-align: center;
    }
    .kpi-note {
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .accent { color: var(--accent); }
    .blue { color: var(--accent-2); }
    .warn { color: var(--warning); }

    .grid {
      display: grid; grid-template-columns: 1fr; gap: 18px; margin-bottom: 18px;
    }
    .card { padding: 16px; overflow: hidden; }
    .card h2 { margin: 0 0 2px; font-size: 16px; }
    .card .card-subtitle { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
    .chart-box { position: relative; height: 330px; }


    .table-card { padding: 0; }
    .table-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 16px 12px;
    }
    .table-head h2 { margin: 0; font-size: 16px; }
    .table-info { color: var(--muted); font-size: 12px; text-align: right; }
    .table-scroll { overflow: auto; max-height: 560px; border-top: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    thead { position: sticky; top: 0; z-index: 2; }
    th {
      text-align: left; color: #c8d5e9; background: #1a2942; padding: 11px 12px;
      border-bottom: 1px solid var(--line); font-weight: 700;
    }
    td { padding: 10px 12px; border-bottom: 1px solid rgba(42,59,87,.64); color: #e3eaf5; }
    tbody tr:hover { background: rgba(108,168,255,.065); }
    .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
    .pagination {
      display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 13px 16px;
      border-top: 1px solid var(--line);
    }
    .pagination button { width: auto; min-height: 34px; padding: 6px 12px; }
    .pagination button:disabled { opacity: .45; cursor: default; }
    .page-label { color: var(--muted); font-size: 12px; }

    .matrix-table th,
    .matrix-table td { text-align: center; }
    .matrix-table th:first-child,
    .matrix-table td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      z-index: 1;
      background: #17243b;
      font-weight: 700;
    }
    .matrix-table thead th:first-child {
      z-index: 3;
      background: #1a2942;
    }
    .matrix-table td.matrix-value { color: var(--accent); font-variant-numeric: tabular-nums; }
    .matrix-table td.matrix-warning {
      color: #ffd98a;
      background: rgba(255,189,89,.17);
      font-weight: 700;
    }
    .matrix-table td.matrix-danger {
      color: #ffd0d0;
      background: rgba(255,115,115,.18);
      font-weight: 700;
    }
    .matrix-table td.matrix-empty { color: #71839f; }

    @media (max-width: 1050px) {
      .filters { grid-template-columns: repeat(3, minmax(150px, 1fr)); }
      .grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 680px) {
      .wrap { padding: 14px; }
      .topbar { flex-direction: column; gap: 12px; }
      .filters, .kpis { grid-template-columns: 1fr 1fr; }
      .filters button { grid-column: span 2; }
      .chart-box { height: 245px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div>
        <h1>Dashboard · Tiempos Descarga Planta FAS</h1>
        <div class="subtitle" id="updatedText">Cargando información...</div>
      </div>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Conectando</span></div>
    </header>

    <div class="notice" id="notice"></div>

    <section class="filters">
      <div><label for="yearFilter">Año</label><select id="yearFilter"><option value="">Todos</option></select></div>
      <div><label for="monthFilter">Mes</label><select id="monthFilter"><option value="">Todos</option></select></div>
      <div><label for="weekFilter">Semana</label><select id="weekFilter"><option value="">Todas</option></select></div>
      <div><label for="dateFilter">FechaRto</label><select id="dateFilter" aria-label="Filtrar por FechaRto"><option value="">Todas</option></select></div>
      <button id="clearFilters" type="button">Limpiar filtros</button>
    </section>

    <section class="kpis">
      <article class="kpi"><div class="kpi-title">Descargas en el período</div><div class="kpi-value accent" id="kpiRecords">—</div><div class="kpi-note" id="kpiRecordsNote">—</div></article>
      <article class="kpi"><div class="kpi-title">Demora promedio en el período</div><div class="kpi-value warn" id="kpiDepots">—</div><div class="kpi-note" id="kpiDelayNote">Según filtros aplicados</div></article>
      <article class="kpi"><div class="kpi-title">Días con descargas</div><div class="kpi-value" id="kpiDays">—</div><div class="kpi-note" id="kpiRange">—</div></article>
    </section>

    <section class="grid">
      <article class="card">
        <h2>Actividad por fecha · Frimosa</h2>
        <p class="card-subtitle"></p>
        <div class="chart-box"><canvas id="dateChart"></canvas></div>
      </article>
    </section>

    <section class="card table-card">
      <div class="table-head">
        <div>
          <h2>Demora promedio - Frimosa</h2>
          <div class="card-subtitle" id="matrixInfo"></div>
        </div>

      </div>
      <div class="table-scroll">
        <table class="matrix-table">
          <thead id="matrixHead"></thead>
          <tbody id="matrixBody"></tbody>
        </table>
        <div class="empty" id="matrixEmpty" hidden>No hay demoras calculables para Frimosa.</div>
      </div>
    </section>
  </main>

<script>
/* ==========================================================
   DASHBOARD TIEMPOS DESCARGA · FRIMOSA
   Fuente optimizada: PostgreSQL -> Python -> TiemposDescarga.json
   ========================================================== */

const URL_JSON = "https://dl.dropbox.com/scl/fi/r9rfkdtrctupi1tsavj1w/TiemposDescarga.json?rlkey=p9ksh6uurwummknad3jsvzzs1&dl=1";

const MONTHS_ES = [
  "enero", "febrero", "marzo", "abril", "mayo", "junio",
  "julio", "agosto", "setiembre", "octubre", "noviembre", "diciembre"
];

let allRecords = [];
let preparedRecords = [];
let filteredRecords = [];
let dateChart = null;
let useCurrentWeekForInitialChart = true;

const $ = id => document.getElementById(id);

function cleanValue(value) {
  return value === null || value === undefined ? "" : String(value).trim();
}

function normalizeMonth(value) {
  const raw = cleanValue(value).toLowerCase();
  if (!raw) return "";

  const aliases = {
    "enero": "enero",
    "febrero": "febrero",
    "marzo": "marzo",
    "abril": "abril",
    "mayo": "mayo",
    "junio": "junio",
    "julio": "julio",
    "agosto": "agosto",
    "septiembre": "setiembre",
    "setiembre": "setiembre",
    "octubre": "octubre",
    "noviembre": "noviembre",
    "diciembre": "diciembre"
  };

  if (aliases[raw]) return aliases[raw];

  const numeric = Number(raw);
  if (Number.isInteger(numeric) && numeric >= 1 && numeric <= 12) {
    return MONTHS_ES[numeric - 1];
  }

  return raw;
}

function formatMonth(value) {
  const month = cleanValue(value);
  return month ? month.charAt(0).toUpperCase() + month.slice(1) : "";
}

function parseDateValue(value) {
  const raw = cleanValue(value);
  if (!raw) return null;

  let m = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) {
    return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  }

  m = raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
  if (m) {
    return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  }

  const parsed = new Date(raw);
  if (Number.isNaN(parsed.getTime())) return null;

  return new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
}

function localDateKey(date) {
  if (!(date instanceof Date) || Number.isNaN(date.getTime())) return "";
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

function getISOWeek(date) {
  if (!(date instanceof Date) || Number.isNaN(date.getTime())) return "";

  const utcDate = new Date(Date.UTC(
    date.getFullYear(),
    date.getMonth(),
    date.getDate()
  ));

  const dayNumber = utcDate.getUTCDay() || 7;
  utcDate.setUTCDate(utcDate.getUTCDate() + 4 - dayNumber);

  const yearStart = new Date(Date.UTC(utcDate.getUTCFullYear(), 0, 1));

  return String(
    Math.ceil((((utcDate - yearStart) / 86400000) + 1) / 7)
  );
}

function getISOWeekRange(year, week) {
  const numericYear = Number(year);
  const numericWeek = Number(week);

  if (!Number.isInteger(numericYear) ||
      !Number.isInteger(numericWeek) ||
      numericWeek < 1 ||
      numericWeek > 53) {
    return null;
  }

  const jan4 = new Date(numericYear, 0, 4);
  const jan4Day = jan4.getDay() || 7;

  const mondayWeek1 = new Date(jan4);
  mondayWeek1.setDate(jan4.getDate() - jan4Day + 1);

  const startDate = new Date(mondayWeek1);
  startDate.setDate(mondayWeek1.getDate() + (numericWeek - 1) * 7);

  const endDate = new Date(startDate);
  endDate.setDate(startDate.getDate() + 6);

  startDate.setHours(0, 0, 0, 0);
  endDate.setHours(0, 0, 0, 0);

  return { startDate, endDate };
}

function dateLabel(date) {
  return new Intl.DateTimeFormat("es-UY", {
    day: "2-digit",
    month: "short"
  }).format(date);
}

function fullDateLabel(date) {
  return new Intl.DateTimeFormat("es-UY", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  }).format(date);
}

function formatDateFilterOption(dateKey) {
  const [year, month, day] = String(dateKey).split("-").map(Number);
  if (!year || !month || !day) return dateKey;

  return new Intl.DateTimeFormat("es-UY", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  }).format(new Date(year, month - 1, day));
}

function formatMinutesAsHours(minutes) {
  if (!Number.isFinite(minutes)) return "Sin demora";

  const total = Math.round(minutes);
  const hours = Math.floor(total / 60);
  const remaining = total % 60;

  return `${String(hours).padStart(2, "0")}:${String(remaining).padStart(2, "0")}`;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[char]));
}

function setNotice(message = "", type = "") {
  const notice = $("notice");
  notice.textContent = message;
  notice.className = "notice" + (type ? " " + type : "");
  notice.style.display = message ? "block" : "none";
}

function setStatus(text, color) {
  $("statusText").textContent = text;
  $("statusDot").style.background = color;
}

function prepareRecords(records) {
  return records
    .map((record, index) => {
      const date = parseDateValue(record.fecharto);
      const delay = Number(record.demora_minutos);

      const year = cleanValue(record.ano) ||
        (date ? String(date.getFullYear()) : "");

      const month = normalizeMonth(record.mes) ||
        (date ? MONTHS_ES[date.getMonth()] : "");

      const weekRaw = cleanValue(record.semana);
      const week = /^\d{1,2}$/.test(weekRaw)
        ? String(Number(weekRaw))
        : (date ? getISOWeek(date) : "");

      return {
        index,
        record,
        year,
        month,
        week,
        date,
        dateKey: date ? localDateKey(date) : "",
        plate: cleanValue(record.matricula),
        delayMinutes:
          Number.isFinite(delay) && delay >= 0 && delay <= 240
            ? delay
            : null
      };
    })
    .filter(item => item.plate && !/^0+([.,]0+)?$/.test(item.plate));
}

function getFilters() {
  return {
    year: $("yearFilter").value,
    month: $("monthFilter").value,
    week: $("weekFilter").value,
    date: $("dateFilter").value
  };
}

function matchesFilters(item, filters) {
  return (!filters.year || item.year === filters.year) &&
         (!filters.month || item.month === filters.month) &&
         (!filters.week || item.week === filters.week) &&
         (!filters.date || item.dateKey === filters.date);
}

function populateFilters() {
  const selectedYear = $("yearFilter").value;
  const selectedMonth = $("monthFilter").value;
  const selectedWeek = $("weekFilter").value;

  const years = [...new Set(
    preparedRecords.map(item => item.year).filter(Boolean)
  )].sort((a, b) => Number(b) - Number(a));

  $("yearFilter").innerHTML =
    '<option value="">Todos</option>' +
    years.map(year =>
      `<option value="${escapeHtml(year)}">${escapeHtml(year)}</option>`
    ).join("");

  $("yearFilter").disabled = years.length === 0;

  if (years.includes(selectedYear)) {
    $("yearFilter").value = selectedYear;
  }

  const availableMonths = new Set(
    preparedRecords
      .filter(item => !selectedYear || item.year === selectedYear)
      .map(item => item.month)
      .filter(Boolean)
  );

  const months = MONTHS_ES.filter(month => availableMonths.has(month));

  $("monthFilter").innerHTML =
    '<option value="">Todos</option>' +
    months.map(month =>
      `<option value="${escapeHtml(month)}">${escapeHtml(formatMonth(month))}</option>`
    ).join("");

  $("monthFilter").disabled = months.length === 0;

  if (months.includes(selectedMonth)) {
    $("monthFilter").value = selectedMonth;
  } else {
    $("monthFilter").value = "";
  }

  const activeMonth = $("monthFilter").value;

  const weeks = [...new Set(
    preparedRecords
      .filter(item =>
        (!selectedYear || item.year === selectedYear) &&
        (!activeMonth || item.month === activeMonth) &&
        item.week
      )
      .map(item => item.week)
  )].sort((a, b) => Number(a) - Number(b));

  $("weekFilter").innerHTML =
    '<option value="">Todas</option>' +
    weeks.map(week =>
      `<option value="${escapeHtml(week)}">Semana ${escapeHtml(week)}</option>`
    ).join("");

  $("weekFilter").disabled = weeks.length === 0;
  $("weekFilter").value = weeks.includes(selectedWeek) ? selectedWeek : "";
}

function refreshDateFilter() {
  const selectedDate = $("dateFilter").value;
  const filters = getFilters();

  const dates = [...new Set(
    preparedRecords
      .filter(item =>
        (!filters.year || item.year === filters.year) &&
        (!filters.month || item.month === filters.month) &&
        (!filters.week || item.week === filters.week)
      )
      .map(item => item.dateKey)
      .filter(Boolean)
  )].sort((a, b) => b.localeCompare(a));

  $("dateFilter").innerHTML =
    '<option value="">Todas</option>' +
    dates.map(dateKey =>
      `<option value="${escapeHtml(dateKey)}">${escapeHtml(formatDateFilterOption(dateKey))}</option>`
    ).join("");

  $("dateFilter").disabled = dates.length === 0;
  $("dateFilter").value = dates.includes(selectedDate) ? selectedDate : "";
}

function applyFilters() {
  populateFilters();
  refreshDateFilter();

  const filters = getFilters();

  filteredRecords = preparedRecords.filter(item =>
    matchesFilters(item, filters)
  );

  render();
}

function getActivityMetrics() {
  const filters = getFilters();

  const selectedItems = preparedRecords.filter(item =>
    matchesFilters(item, filters)
  );

  const metrics = new Map();

  for (const item of selectedItems) {
    if (!item.date || !item.dateKey) continue;

    if (!metrics.has(item.dateKey)) {
      metrics.set(item.dateKey, {
        date: new Date(item.date),
        records: 0,
        delayTotal: 0,
        delayCount: 0
      });
    }

    const bucket = metrics.get(item.dateKey);
    bucket.records++;

    if (Number.isFinite(item.delayMinutes)) {
      bucket.delayTotal += item.delayMinutes;
      bucket.delayCount++;
    }
  }

  if (filters.date) {
    const value = metrics.get(filters.date);
    if (!value) return [];

    return [{
      ...value,
      delayAverage:
        value.delayCount
          ? Math.round(value.delayTotal / value.delayCount)
          : null
    }];
  }

  if (filters.week) {
    let weekYear = filters.year;

    if (!weekYear) {
      weekYear =
        selectedItems.find(item => item.year)?.year ||
        preparedRecords.find(item =>
          item.week === filters.week && item.year
        )?.year ||
        "";
    }

    const range = getISOWeekRange(weekYear, filters.week);
    if (!range) return [];

    const result = [];
    const cursor = new Date(range.startDate);

    while (cursor <= range.endDate) {
      const key = localDateKey(cursor);

      const value = metrics.get(key) || {
        date: new Date(cursor),
        records: 0,
        delayTotal: 0,
        delayCount: 0
      };

      result.push({
        ...value,
        delayAverage:
          value.delayCount
            ? Math.round(value.delayTotal / value.delayCount)
            : null
      });

      cursor.setDate(cursor.getDate() + 1);
    }

    return result;
  }

  if (
    useCurrentWeekForInitialChart &&
    !filters.week &&
    !filters.month &&
    !filters.date
  ) {
    const today = new Date();
    const currentWeek = getISOWeek(today);
    const currentYear = String(today.getFullYear());

    const range = getISOWeekRange(currentYear, currentWeek);

    if (range) {
      const result = [];
      const cursor = new Date(range.startDate);

      while (cursor <= range.endDate) {
        const key = localDateKey(cursor);

        const value = metrics.get(key) || {
          date: new Date(cursor),
          records: 0,
          delayTotal: 0,
          delayCount: 0
        };

        result.push({
          ...value,
          delayAverage:
            value.delayCount
              ? Math.round(value.delayTotal / value.delayCount)
              : null
        });

        cursor.setDate(cursor.getDate() + 1);
      }

      return result;
    }
  }

  return [...metrics.values()]
    .sort((a, b) => a.date - b.date)
    .map(value => ({
      ...value,
      delayAverage:
        value.delayCount
          ? Math.round(value.delayTotal / value.delayCount)
          : null
    }));
}

function renderKpis() {
  const dates = filteredRecords
    .map(item => item.date)
    .filter(Boolean)
    .sort((a, b) => a - b);

  const delayValues = filteredRecords
    .map(item => item.delayMinutes)
    .filter(value => Number.isFinite(value));

  const averageDelay = delayValues.length
    ? Math.round(
        delayValues.reduce((sum, value) => sum + value, 0) /
        delayValues.length
      )
    : null;

  $("kpiRecords").textContent =
    filteredRecords.length.toLocaleString("es-UY");

  $("kpiRecordsNote").textContent = "";

  $("kpiDepots").textContent =
    averageDelay === null
      ? "—"
      : formatMinutesAsHours(averageDelay);

  $("kpiDelayNote").textContent =
    averageDelay === null
      ? "Sin demoras calculables"
      : "";

  $("kpiDays").textContent =
    new Set(dates.map(date => localDateKey(date))).size
      .toLocaleString("es-UY");

  $("kpiRange").textContent =
    dates.length
      ? `${fullDateLabel(dates[0])} a ${fullDateLabel(dates.at(-1))}`
      : "Sin fechas identificadas";
}

function renderRecentActivityChart() {
  if (dateChart) {
    dateChart.destroy();
  }

  const recent = getActivityMetrics();

  dateChart = new Chart($("dateChart"), {
    data: {
      labels: recent.map(item => [
        dateLabel(item.date),
        `Registros: ${item.records}`,
        item.records === 0 && !Number.isFinite(item.delayAverage)
          ? "Sin descarga"
          : `Demora: ${formatMinutesAsHours(item.delayAverage)}`
      ]),
      datasets: [
        {
          type: "bar",
          label: "Registros",
          data: recent.map(item => item.records),
          backgroundColor: "rgba(108,168,255,.78)",
          borderColor: "#6ca8ff",
          borderWidth: 1,
          borderRadius: 6,
          yAxisID: "y"
        },
        {
          type: "line",
          label: "Demora promedio en el período",
          data: recent.map(item => item.delayAverage),
          borderColor: "#39d0ba",
          backgroundColor: "rgba(57,208,186,.22)",
          pointBackgroundColor: "#39d0ba",
          pointRadius: 4,
          borderWidth: 2,
          spanGaps: false,
          tension: .32,
          yAxisID: "yDelay"
        },
        {
          type: "line",
          label: "Límite Ideal 01:00hs",
          data: recent.map(() => 60),
          borderColor: "#ffbd59",
          borderWidth: 2,
          borderDash: [7, 5],
          pointRadius: 0,
          pointHoverRadius: 0,
          fill: false,
          tension: 0,
          yAxisID: "yDelay"
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: "index",
        intersect: false
      },
      plugins: {
        legend: {
          display: false
        },
        tooltip: {
          backgroundColor: "#101a2d",
          titleColor: "#fff",
          bodyColor: "#d9e4f6",
          borderColor: "#344967",
          borderWidth: 1,
          callbacks: {
            label(context) {
              if (context.dataset.label === "Límite Ideal 01:00hs") {
                return "Límite Ideal: 01:00hs";
              }

              if (context.dataset.yAxisID === "yDelay") {
                const day = recent[context.dataIndex];

                if (
                  day &&
                  day.records === 0 &&
                  !Number.isFinite(context.raw)
                ) {
                  return "Sin descarga";
                }

                return `Demora promedio en el período: ${formatMinutesAsHours(context.raw)}`;
              }

              return `Registros: ${context.raw ?? 0}`;
            }
          }
        }
      },
      scales: {
        x: {
          ticks: {
            color: "#9aacc6",
            maxRotation: 0,
            autoSkip: true,
            maxTicksLimit: 16,
            font: { size: 11 },
            padding: 10
          },
          grid: {
            display: false
          }
        },
        y: {
          beginAtZero: true,
          position: "left",
          ticks: {
            color: "#9aacc6",
            precision: 0
          },
          title: {

            color: "#9aacc6"
          },

          }
        },
        yDelay: {

function getFrimosaMonthlyMatrix() {
  const accumulators = new Map();

  for (const item of preparedRecords) {
    if (!item.year || !item.month) continue;
    if (!Number.isFinite(item.delayMinutes)) continue;

    const key = `${item.year}|${item.month}`;

    const current =
      accumulators.get(key) ||
      { total: 0, count: 0 };

    current.total += item.delayMinutes;
    current.count++;

    accumulators.set(key, current);
  }

  const years = [...new Set(
    [...accumulators.keys()]
      .map(key => key.split("|")[0])
      .filter(year => Number(year) >= 2020)
  )].sort((a, b) => Number(b) - Number(a));

  const matrix = new Map();

  for (const year of years) {
    const row = {};

    for (const month of MONTHS_ES) {
      const current =
        accumulators.get(`${year}|${month}`);

      row[month] =
        current
          ? Math.round(current.total / current.count)
          : null;
    }

    matrix.set(year, row);
  }

  return { years, matrix };
}

function renderMonthlyDelayMatrix() {
  const { years, matrix } = getFrimosaMonthlyMatrix();

  $("matrixHead").innerHTML = `
    <tr>
      <th>Año</th>
      ${MONTHS_ES.map(month =>
        `<th>${escapeHtml(formatMonth(month))}</th>`
      ).join("")}
    </tr>
  `;

  $("matrixBody").innerHTML = years.map(year => {
    const row = matrix.get(year);

    return `
      <tr>
        <td>${escapeHtml(year)}</td>

        ${MONTHS_ES.map(month => {
          const value = row[month];

          if (value === null) {
            return '<td class="matrix-empty">—</td>';
          }

          const cellClass =
            value > 90
              ? "matrix-danger"
              : value > 60
                ? "matrix-warning"
                : "matrix-value";

          return `
            <td class="${cellClass}">
              ${escapeHtml(formatMinutesAsHours(value))}
            </td>
          `;
        }).join("")}
      </tr>
    `;
  }).join("");

  $("matrixEmpty").hidden = years.length !== 0;
}

function render() {
  renderKpis();
  renderRecentActivityChart();
  renderMonthlyDelayMatrix();
}

function applyDefaultFilters() {
  const preferredYear = "2026";

  const years = [...new Set(
    preparedRecords.map(item => item.year).filter(Boolean)
  )];

  $("yearFilter").value =
    years.includes(preferredYear)
      ? preferredYear
      : years.sort((a, b) => Number(b) - Number(a))[0] || "";

  $("monthFilter").value = "";
  $("weekFilter").value = "";
  $("dateFilter").value = "";

  useCurrentWeekForInitialChart = true;

  applyFilters();
}

function registerEvents() {
  $("yearFilter").addEventListener("change", () => {
    useCurrentWeekForInitialChart = false;
    $("dateFilter").value = "";
    applyFilters();
  });

  $("monthFilter").addEventListener("change", () => {
    useCurrentWeekForInitialChart = false;
    $("weekFilter").value = "";
    $("dateFilter").value = "";
    applyFilters();
  });

  $("weekFilter").addEventListener("change", () => {
    useCurrentWeekForInitialChart = false;

    if ($("weekFilter").value) {
      $("monthFilter").value = "";
    }

    $("dateFilter").value = "";
    applyFilters();
  });

  $("dateFilter").addEventListener("change", () => {
    useCurrentWeekForInitialChart = false;
    applyFilters();
  });

  $("clearFilters").addEventListener("click", () => {
    $("yearFilter").value = "";
    $("monthFilter").value = "";
    $("weekFilter").value = "";
    $("dateFilter").value = "";

    useCurrentWeekForInitialChart = false;

    applyFilters();
  });
}

function formatUpdated(value) {
  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return cleanValue(value);
  }

  return new Intl.DateTimeFormat("es-UY", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).format(date);
}

async function loadData() {
  try {
    setStatus("Cargando", "#ffbd59");
    setNotice("");

    const separator =
      URL_JSON.includes("?") ? "&" : "?";

    const response = await fetch(
      `${URL_JSON}${separator}_=${Date.now()}`,
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error(
        `Dropbox respondió HTTP ${response.status}.`
      );
    }

    const payload = await response.json();

    if (
      !payload ||
      !Array.isArray(payload.registros)
    ) {
      throw new Error(
        "El JSON no contiene la propiedad 'registros'."
      );
    }

    allRecords = payload.registros;
    preparedRecords = prepareRecords(allRecords);

    if (!preparedRecords.length) {
      throw new Error(
        "El JSON se cargó pero no contiene registros válidos."
      );
    }

    populateFilters();

    const updated = formatUpdated(payload.actualizado);

    $("updatedText").textContent =
      updated
        ? `Datos actualizados: ${updated}`
        : `${preparedRecords.length.toLocaleString("es-UY")} registros`;

    setStatus("Actualizado", "#39d0ba");

    applyDefaultFilters();

  } catch (error) {
    console.error(error);

    setStatus("Error de carga", "#ff7373");

    $("updatedText").textContent =
      "No fue posible cargar la información.";

    setNotice(
      "No se pudo leer TiemposDescarga.json. Detalle: " +
      error.message,
      "error"
    );
  }
}

registerEvents();
loadData();
</script>
